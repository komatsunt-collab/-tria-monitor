<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0a0c10">
<title>Tria Monitor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0c10;color:#e2e8f0;font-family:sans-serif}
header{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e2330;position:sticky;top:0;background:#0a0c10}
.dot{width:8px;height:8px;border-radius:50%;background:#4b5563;display:inline-block;margin-right:8px}
.dot.safe{background:#22c55e}
.dot.warning{background:#f0a500;animation:p 1.5s infinite}
.dot.danger{background:#ef4444;animation:p .8s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes s{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border:2px solid #333;border-top-color:#f0a500;border-radius:50%;animation:s 1s linear infinite;display:inline-block;margin-right:8px;vertical-align:middle}
.card{margin:16px;padding:18px;border-radius:12px;border:1px solid #1e2330;background:#111318}
.card.safe{border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.06)}
.card.warning{border-color:rgba(240,165,0,.4);background:rgba(240,165,0,.06)}
.card.danger{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.06)}
.lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.val{font-size:22px;font-weight:700}
.safe .val{color:#22c55e}.warning .val{color:#f0a500}.danger .val{color:#ef4444}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px 16px}
.mc{background:#111318;border:1px solid #1e2330;border-radius:12px;padding:16px}
.mc.safe .mv{color:#22c55e}.mc.warning .mv{color:#f0a500}.mc.danger .mv{color:#ef4444}
.mv{font-size:22px;font-weight:700}.ms{font-size:10px;color:#4b5563;margin-top:4px}
.sec{font-size:10px;color:#4b5563;text-transform:uppercase;letter-spacing:.1em;margin:0 16px 8px}
.al{margin:0 16px 8px;display:flex;gap:8px;padding:12px;border-radius:8px;border:1px solid transparent}
.al.safe{background:rgba(34,197,94,.06);border-color:rgba(34,197,94,.2)}
.al.warning{background:rgba(240,165,0,.06);border-color:rgba(240,165,0,.2)}
.al.danger{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.2)}
.at{font-size:13px;line-height:1.5}
.btn{display:block;width:calc(100% - 32px);margin:16px;padding:16px;background:#f0a500;color:#000;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
.btn:disabled{background:#111318;color:#4b5563;border:1px solid #1e2330}
.note{text-align:center;font-size:10px;color:#4b5563;padding:0 20px 40px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div><span class="dot" id="dot"></span><strong>TRIA MONITOR</strong></div>
  <div style="font-size:10px;color:#4b5563" id="tm">--</div>
</header>
<div id="out" style="padding:30px;text-align:center;color:#94a3b8">
  <span class="spin"></span>データ取得中...
</div>
